<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Iqra Admin</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0A0A0A">
<link rel="icon" href="../teacher/1-icon-192-v3.png">
<link rel="apple-touch-icon" href="../teacher/1-icon-192-v3.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  html,body{margin:0;padding:0;height:100%;background:#0A0A0A;overflow:hidden}
  #frame{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}
  #splash{position:fixed;inset:0;background:#0A0A0A;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;transition:opacity .4s}
  #splash img{width:min(82vw,340px);height:auto;border-radius:0}
  #splash p{color:#47A59D;font-family:Arial,sans-serif;font-size:14px;letter-spacing:2px;margin-top:18px}
</style>
</head>
<body>
<div id="splash"><img src="../teacher/3-header-logo.png" alt="IQRA Online Academy"><p>IQRA ADMIN</p></div>
<iframe id="frame" src="https://script.google.com/macros/s/AKfycbxepQJVNRqiBUqbPj2ethtXTJvZ1kpEzlrkS3PTuQjLOlSatr-SdHKRppN7qnsua-dG5Q/exec?page=admin" allow="clipboard-write"></iframe>
<script>
  var f = document.getElementById('frame'), s = document.getElementById('splash');
  f.addEventListener('load', function(){ setTimeout(function(){ s.style.opacity='0'; setTimeout(function(){ s.remove(); }, 450); }, 400); });
  if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(function(){}); }
</script>
</body>
</html>
